name: Verify Spotify token

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Model-check token refresh
        run: bash scripts/verify-spotify-token.sh

      - name: Run single-flight tests
        run: node --experimental-strip-types --test lib/single-flight.test.ts
