name: Test

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run feed list contract tests
        run: node --experimental-strip-types --test lib/as-list.test.ts
